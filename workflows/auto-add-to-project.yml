name: Auto Add to Global Project

on:
  issues:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add Issue to Project
        uses: actions/add-to-project@v0.5.0  
        with:
          project-url: https://github.com/orgs/innovaintegra/projects/16
          github-token: ${{ secrets.GLOBAL_PROJECT_PAT }}
